<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archived site — Archive Shelf</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; }
    replay-web-page { display: block; width: 100%; height: 100%; }
    #message { padding: 18px; color: #733b00; font: 14px/1.5 "Segoe UI", Arial, sans-serif; }
  </style>
  <script defer src="/replay/ui.js"></script>
  <script defer src="/replay-viewer.js"></script>
</head>
<body>
  <div id="message" role="status" hidden></div>
  <replay-web-page id="replay" embed="default" deepLink replaybase="/replay/" require-subdomain-iframe></replay-web-page>
</body>
</html>
